# =========================================================
# 拾音 · Cloudflare 部署配置（wrangler.toml）
# 一条命令部署：npx wrangler deploy
# =========================================================

name = "shiyin"
main = "src/worker.js"
compatibility_date = "2024-11-06"

# 静态资源（public/ 目录），Worker 通过 env.ASSETS 访问
[assets]
directory = "./public"
binding = "ASSETS"
# 未命中静态资源的请求交给 Worker 处理（/ws、/api/*）
not_found_handling = "single-page-application"

# ── Durable Object：每个房间码一个实例 ──
[[durable_objects.bindings]]
name = "SIGNALING"
class_name = "SignalingRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalingRoom"]

# ── 运行时变量 ──
[vars]
STUN_URLS = "stun:stun.cloudflare.com:3478,stun:stun.l.google.com:19302,stun:stun.miwifi.com:3478,stun:stun.qq.com:3478"
MAX_GROUP = "4"
PREFIX = "shiyin"
RECONNECT_SECONDS = "60"
TURN_TTL = "86400"

# ── 需要自建 TURN（coturn）时取消下面注释并填写 ──
# TURN_URL = "turn:turn.example.com:3478?transport=udp,turn:turn.example.com:3478?transport=tcp,turns:turn.example.com:5349?transport=tcp"
# TURN_USERNAME = "shiyin"
# TURN_CREDENTIAL = "change-me"

# ── 使用 Cloudflare Calls 托管 TURN 时，用 secret 保存长期密钥（不要写进本文件）──
#   npx wrangler secret put CF_TURN_KEY_ID
#   npx wrangler secret put CF_TURN_API_TOKEN

# ── 本地开发 ──
#   npx wrangler dev
# ── 生产部署 ──
#   npx wrangler deploy
